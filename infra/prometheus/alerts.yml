groups:
  - name: clouddesk-api
    rules:
      - alert: CloudDeskBackendDown
        expr: up{job="ecop-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "CloudDesk API is down"
          description: "Prometheus cannot scrape the CloudDesk backend for more than 1 minute."

      - alert: CloudDeskHigh5xxRate
        expr: |
          (
            sum(rate(ecop_http_requests_total{status=~"5.."}[5m]))
            /
            clamp_min(sum(rate(ecop_http_requests_total[5m])), 0.001)
          ) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CloudDesk 5xx error rate is above 5%"
          description: "Investigate the failing endpoints in Grafana / Runtime traces."

      - alert: CloudDeskHighP95Latency
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(ecop_http_request_duration_seconds_bucket[5m])) by (le)
          ) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CloudDesk P95 latency is above 2s"
          description: "Check model latency, database health and request volume."
