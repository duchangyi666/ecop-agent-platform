  - id: clouddesk-web
    redirectURIs:
      - http://localhost:3000/auth/callback
      - http://127.0.0.1:3000/auth/callback
    name: CloudDesk Web
    secret: clouddesk-local-dev-only

enablePasswordDB: true

staticPasswords:
