services:
  postgres:
    image: postgres:15
    container_name: ecop-postgres-task1
    restart: unless-stopped
    environment:
      POSTGRES_DB: enterprise_customer_operations
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      TZ: UTC
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d enterprise_customer_operations"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    volumes:
      - ecop_postgres_task1_data:/var/lib/postgresql/data

volumes:
  ecop_postgres_task1_data:
    name: ecop_postgres_task1_data
