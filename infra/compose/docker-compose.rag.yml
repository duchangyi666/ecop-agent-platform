services:
  etcd:
    image: quay.io/coreos/etcd:v3.5.14
    container_name: ecop-rag-etcd
    restart: unless-stopped
    command:
      - etcd
      - -advertise-client-urls=http://127.0.0.1:2379
      - -listen-client-urls=http://0.0.0.0:2379
      - --data-dir=/etcd
    ports:
      - "12379:2379"
    volumes:
      - ecop_rag_etcd_data:/etcd

  minio:
    image: minio/minio:RELEASE.2023-03-20T20-16-18Z
    container_name: ecop-rag-minio
    restart: unless-stopped
    command: ["minio", "server", "/minio_data"]
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - ecop_rag_minio_data:/minio_data

  milvus:
    image: milvusdb/milvus:v2.4.4
    container_name: ecop-rag-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    ports:
      - "19541:19530"
    depends_on:
      - etcd
      - minio

volumes:
  ecop_rag_etcd_data:
    name: ecop_rag_etcd_data
  ecop_rag_minio_data:
    name: ecop_rag_minio_data
