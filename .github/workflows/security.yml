name: Security

on:
  push:
    branches: [main, "chore/**", "feat/**"]
  pull_request:
  schedule:
    - cron: "0 3 * * 1"

permissions:
  contents: read
  actions: write
  security-events: write
  pull-requests: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript-typescript]
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      - uses: github/codeql-action/analyze@v4

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:latest \
            detect --source=/repo --no-git --config=/repo/.gitleaks.toml --redact -v

  dependencies:
    name: Dependency and image scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install .
      - name: pip-audit
        # Advisory until the dependency-refresh sprint lands; findings are
        # uploaded as an artifact and tracked in docs/security/依赖漏洞基线.md.
        continue-on-error: true
        run: |
          pip install pip-audit
          pip-audit -f json -o pip-audit.json || true
      - name: Upload pip-audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit.json
          if-no-files-found: ignore
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: npm audit
        run: |
          cd frontend
          npm ci --no-audit --no-fund
          npm audit --audit-level=high
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.33.1
        with:
          scan-type: fs
          scan-ref: .
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          artifact-name: clouddesk-sbom.spdx.json
