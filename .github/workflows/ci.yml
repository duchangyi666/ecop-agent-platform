name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check legacy frontend syntax
        run: node --check frontend_legacy/app.js

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci --no-audit --no-fund

      - name: Lint frontend
        run: |
          cd frontend
          npm run lint

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Start dependencies
        run: |
          docker compose up -d postgres redis etcd minio milvus
          sleep 30

      - name: Verify database
        run: |
          python -m alembic upgrade head
          python scripts/verify_database.py
        env:
          DATABASE_URL: postgresql+asyncpg://app:app@localhost:54329/enterprise_customer_operations
          MILVUS_URI: http://localhost:19541

      - name: Run tests
        run: python -m pytest tests/unit tests/integration/database tests/integration/agent tests/integration/api tests/integration/security tests/integration/vectorstore tests/integration/external_services -q
        env:
          DATABASE_URL: postgresql+asyncpg://app:app@localhost:54329/enterprise_customer_operations
          TEST_DATABASE_URL: postgresql+asyncpg://app:app@localhost:54329/enterprise_customer_operations
          MILVUS_URI: http://localhost:19541
          PYTHONNOUSERSITE: "1"

      - name: Install browser for demo smoke
        run: npx --no-install playwright install --with-deps chromium
        working-directory: frontend

      - name: Run demo browser smoke
        shell: bash
        env:
          AUTH_MODE: dev
          DATABASE_URL: postgresql+asyncpg://app:app@localhost:54329/enterprise_customer_operations
          JWT_SECRET: ci-only-demo-secret-not-for-production
          DEEPSEEK_API_KEY: ""
          PYTHONNOUSERSITE: "1"
          SMOKE_TENANT_SLUG: clouddesk-ci-demo
        run: |
          set -euo pipefail
          python -m uvicorn backend.main:app --host 127.0.0.1 --port 8000 > /tmp/clouddesk-backend.log 2>&1 &
          backend_pid=$!
          (cd frontend && BACKEND_URL=http://127.0.0.1:8000 npm run start -- --hostname 127.0.0.1 --port 3000) > /tmp/clouddesk-frontend.log 2>&1 &
          frontend_pid=$!
          trap 'kill "$backend_pid" "$frontend_pid" 2>/dev/null || true' EXIT
          for service in http://127.0.0.1:8000/healthz http://127.0.0.1:3000/identity; do
            ready=false
            for attempt in {1..60}; do
              if curl --fail --silent "$service" > /dev/null; then ready=true; break; fi
              sleep 2
            done
            if [ "$ready" != true ]; then
              cat /tmp/clouddesk-backend.log /tmp/clouddesk-frontend.log
              exit 1
            fi
          done
          seed_json=$(python scripts/seed_demo_scenario.py --tenant-slug "$SMOKE_TENANT_SLUG")
          export SMOKE_PAYMENT_ID=$(printf '%s' "$seed_json" | python -c 'import json,sys; print(json.load(sys.stdin)["payment_id"])')
          cd frontend
          npm run test:demo

      - name: Check migrations
        run: python -m alembic check
        env:
          DATABASE_URL: postgresql+asyncpg://app:app@localhost:54329/enterprise_customer_operations

      - name: Check dependencies
        run: python -m pip check

      - name: Build container images
        run: |
          docker build -f infra/docker/backend.Dockerfile -t ecop-backend:ci .
          docker build -f infra/docker/frontend.Dockerfile -t ecop-frontend:ci .
