name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check legacy frontend syntax
        run: node --check frontend_legacy/app.js

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm ci --no-audit --no-fund

      - name: Lint frontend
        run: |
          cd frontend
          npm run lint

      - name: Build frontend
        run: |
          cd frontend
          npm run build

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install .

      - name: Start dependencies
        run: |
          docker compose up -d postgres redis etcd minio milvus
          sleep 30

      - name: Verify database
        run: |
          python -m alembic upgrade head
          python scripts/verify_database.py
        env:
          DATABASE_URL: postgresql+asyncpg://app:app@localhost:54329/enterprise_customer_operations
          MILVUS_URI: http://localhost:19541

      - name: Run tests
        run: python -m pytest tests/unit tests/integration/database tests/integration/agent tests/integration/api tests/integration/vectorstore tests/integration/external_services -q
        env:
          DATABASE_URL: postgresql+asyncpg://app:app@localhost:54329/enterprise_customer_operations
          TEST_DATABASE_URL: postgresql+asyncpg://app:app@localhost:54329/enterprise_customer_operations
          MILVUS_URI: http://localhost:19541
          PYTHONNOUSERSITE: "1"

      - name: Check migrations
        run: python -m alembic check
        env:
          DATABASE_URL: postgresql+asyncpg://app:app@localhost:54329/enterprise_customer_operations

      - name: Check dependencies
        run: python -m pip check

      - name: Build container images
        run: |
          docker build -f infra/docker/backend.Dockerfile -t ecop-backend:ci .
          docker build -f infra/docker/frontend.Dockerfile -t ecop-frontend:ci .
