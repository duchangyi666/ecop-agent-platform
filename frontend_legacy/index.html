<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>CloudDesk 运营工作台</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">
        <div class="brand-mark">CD</div>
        <div>
          <h1>CloudDesk 运营工作台</h1>
          <p class="subtitle">Enterprise Customer Operations</p>
        </div>
      </div>
      <div class="identity">
        <label>
          <span>租户</span>
          <input id="tenantId" autocomplete="off" placeholder="Tenant UUID" />
        </label>
        <label>
          <span>用户</span>
          <input id="userId" autocomplete="off" placeholder="User UUID" />
        </label>
        <button id="tokenBtn" class="primary" type="button">获取 Token</button>
        <div class="connection">
          <span id="statusDot" class="dot"></span>
          <span id="statusText">未连接</span>
        </div>
      </div>
    </header>

    <nav class="tabs" aria-label="工作台导航">
      <button class="tab active" data-view="overview" type="button">总览</button>
      <button class="tab" data-view="consultation" type="button">咨询</button>
      <button class="tab" data-view="conversations" type="button">会话</button>
      <button class="tab" data-view="tickets" type="button">工单</button>
      <button class="tab" data-view="approvals" type="button">审批</button>
      <button class="tab" data-view="knowledge" type="button">知识库</button>
      <button class="tab" data-view="runtime" type="button">Runtime</button>
      <button class="tab" data-view="evaluations" type="button">评测</button>
    </nav>

    <main class="workspace">
      <section id="view-overview" class="view active">
        <div class="section-head">
          <h2>运营状态</h2>
          <button id="overviewRefreshBtn" type="button">刷新</button>
        </div>
        <div class="metric-grid">
          <article class="metric">
            <span>健康检查</span>
            <strong id="overviewHealth">-</strong>
          </article>
          <article class="metric">
            <span>工单</span>
            <strong id="overviewTickets">-</strong>
          </article>
          <article class="metric">
            <span>待审批</span>
            <strong id="overviewApprovals">-</strong>
          </article>
          <article class="metric">
            <span>知识文档</span>
            <strong id="overviewDocs">-</strong>
          </article>
        </div>
        <div class="summary-card">
          <div class="section-head">
            <h3>最近事件</h3>
          </div>
          <div id="overviewEvents" class="empty-state">暂无事件</div>
        </div>
      </section>

      <section id="view-consultation" class="view">
        <div class="split">
          <div class="panel">
            <div class="section-head">
              <h2>客户咨询</h2>
            </div>
            <label class="field">
              <span>消息</span>
              <textarea id="consultationMessage" rows="6">客户咨询退款政策</textarea>
            </label>
            <button id="consultationSendBtn" class="primary" type="button">发送</button>
          </div>
          <div class="panel">
            <div class="section-head">
              <h2>进度事件</h2>
            </div>
            <div id="consultationEvents" class="event-log empty">暂无事件</div>
          </div>
        </div>
      </section>

      <section id="view-conversations" class="view">
        <div class="split">
          <div class="panel">
            <div class="section-head">
              <h2>新建会话</h2>
            </div>
            <label class="field">
              <span>客户 UUID</span>
              <input id="convCustomerId" autocomplete="off" />
            </label>
            <label class="field">
              <span>用户 UUID</span>
              <input id="convUserId" autocomplete="off" />
            </label>
            <label class="field">
              <span>渠道</span>
              <select id="convChannel">
                <option value="customer_portal">客户门户</option>
                <option value="email">邮件</option>
                <option value="chat">在线会话</option>
                <option value="support_workspace">客服工作台</option>
              </select>
            </label>
            <label class="field">
              <span>主题</span>
              <input id="convSubject" autocomplete="off" />
            </label>
            <label class="field">
              <span>首条消息</span>
              <textarea id="convInitialMessage" rows="3"></textarea>
            </label>
            <button id="createConversationBtn" class="primary" type="button">创建会话</button>
          </div>
          <div class="panel">
            <div class="section-head">
              <h2>会话列表</h2>
              <button id="refreshConversationsBtn" type="button">刷新</button>
            </div>
            <div id="conversationList" class="list empty">暂无会话</div>
            <div id="conversationDetail" class="detail empty">选择会话查看详情</div>
            <div class="inline-form">
              <input id="conversationMessageBody" placeholder="回复内容" />
              <button id="sendConversationMessageBtn" type="button">发送</button>
            </div>
          </div>
        </div>
      </section>

      <section id="view-tickets" class="view">
        <div class="split">
          <div class="panel">
            <div class="section-head">
              <h2>新建工单</h2>
            </div>
            <label class="field">
              <span>客户 UUID</span>
              <input id="ticketCustomerId" autocomplete="off" />
            </label>
            <label class="field">
              <span>主题</span>
              <input id="ticketSubject" autocomplete="off" />
            </label>
            <label class="field">
              <span>优先级</span>
              <select id="ticketPriority">
                <option value="low">低</option>
                <option value="medium">中</option>
                <option value="high" selected>高</option>
                <option value="urgent">紧急</option>
              </select>
            </label>
            <label class="field">
              <span>描述</span>
              <textarea id="ticketDescription" rows="3"></textarea>
            </label>
            <label class="field">
              <span>消息</span>
              <textarea id="ticketMessage" rows="3"></textarea>
            </label>
            <button id="createTicketBtn" class="primary" type="button">创建工单</button>
          </div>
          <div class="panel">
            <div class="section-head">
              <h2>工单列表</h2>
              <button id="refreshTicketsBtn" type="button">刷新</button>
            </div>
            <div id="ticketList" class="list empty">暂无工单</div>
            <div id="ticketDetail" class="detail empty">选择工单查看详情</div>
            <div class="inline-form">
              <select id="ticketStatusSelect">
                <option value="in_progress">处理中</option>
                <option value="pending_customer">等待客户</option>
                <option value="escalated">已升级</option>
                <option value="resolved">已解决</option>
                <option value="closed">已关闭</option>
                <option value="cancelled">已取消</option>
              </select>
              <input id="ticketPatchNote" placeholder="处理备注" />
              <button id="updateTicketBtn" type="button">更新状态</button>
            </div>
          </div>
        </div>
      </section>

      <section id="view-approvals" class="view">
        <div class="split">
          <div class="panel">
            <div class="section-head">
              <h2>审批列表</h2>
              <button id="refreshApprovalsBtn" type="button">刷新</button>
            </div>
            <div id="approvalList" class="list empty">暂无审批</div>
          </div>
          <div class="panel">
            <div class="section-head">
              <h2>审批详情</h2>
            </div>
            <div id="approvalDetail" class="detail empty">选择审批查看详情</div>
            <div class="approval-form">
              <label class="field">
                <span>Thread ID</span>
                <input id="approvalThreadId" autocomplete="off" />
              </label>
              <label class="field">
                <span>决策</span>
                <select id="approvalDecision">
                  <option value="true">批准</option>
                  <option value="false">拒绝</option>
                </select>
              </label>
              <label class="field">
                <span>原因</span>
                <textarea id="approvalReason" rows="2"></textarea>
              </label>
              <button id="approvalActionBtn" class="primary" type="button">提交审批决策</button>
            </div>
          </div>
        </div>
      </section>

      <section id="view-knowledge" class="view">
        <div class="grid-2">
          <div class="panel">
            <div class="section-head">
              <h2>知识检索</h2>
            </div>
            <div class="inline-form">
              <input id="knowledgeQuery" autocomplete="off" placeholder="退款政策" />
              <button id="knowledgeSearchBtn" class="primary" type="button">检索</button>
            </div>
            <div id="knowledgeResults" class="list empty">暂无结果</div>
          </div>
          <div class="panel">
            <div class="section-head">
              <h2>文档管理</h2>
              <button id="refreshDocsBtn" type="button">刷新</button>
              <button id="reindexKnowledgeBtn" type="button">重建索引</button>
            </div>
            <div id="knowledgeDocList" class="list empty">暂无文档</div>
          </div>
        </div>
        <div class="panel">
          <div class="section-head">
            <h2>摄取文档</h2>
          </div>
          <div class="form-grid">
            <label class="field">
              <span>外部 ID</span>
              <input id="docExternalId" autocomplete="off" />
            </label>
            <label class="field">
              <span>标题</span>
              <input id="docTitle" autocomplete="off" />
            </label>
            <label class="field">
              <span>来源</span>
              <input id="docSourceUri" autocomplete="off" />
            </label>
            <label class="field">
              <span>可见性</span>
              <select id="docVisibility">
                <option value="tenant">租户</option>
                <option value="public">公开</option>
              </select>
            </label>
          </div>
          <label class="field">
            <span>正文</span>
            <textarea id="docContent" rows="6"></textarea>
          </label>
          <button id="ingestKnowledgeBtn" class="primary" type="button">摄取文档</button>
        </div>
      </section>

      <section id="view-runtime" class="view">
        <div class="section-head">
          <h2>Runtime 观测</h2>
          <div class="actions">
            <button id="tracesBtn" class="primary" type="button">Trace</button>
            <button id="costsBtn" type="button">成本</button>
            <button id="agentsBtn" type="button">Agent</button>
          </div>
        </div>
        <div id="runtimeOutput" class="output empty">暂无运行数据</div>
      </section>

      <section id="view-evaluations" class="view">
        <div class="split">
          <div class="panel">
            <div class="section-head">
              <h2>评测运行</h2>
              <button id="refreshEvalsBtn" type="button">刷新</button>
            </div>
            <div id="evaluationList" class="list empty">暂无评测</div>
          </div>
          <div class="panel">
            <div class="section-head">
              <h2>启动评测</h2>
            </div>
            <label class="field">
              <span>数据集</span>
              <input id="evalDatasetCode" autocomplete="off" value="tenant-retrieval" />
            </label>
            <label class="field">
              <span>用例数</span>
              <input id="evalLimit" type="number" value="5" min="1" max="20" />
            </label>
            <button id="runEvalBtn" class="primary" type="button">运行</button>
          </div>
        </div>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
