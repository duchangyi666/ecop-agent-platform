[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "enterprise-customer-operations-platform"
version = "0.1.0"
description = "Domain and database foundation for enterprise customer operations platform"
requires-python = "==3.11.15"
dependencies = [
  "SQLAlchemy==2.0.36",
  "asyncpg==0.30.0",
  "pydantic==2.11.4",
  "pytest==8.3.4",
  "pytest-asyncio==0.24.0",
  "alembic==1.18.5",
  "langgraph==1.0.9",
  "langchain-core==1.2.16",
  "fastapi==0.117.1",
  "uvicorn==0.32.1",
  "httpx==0.28.1",
  "pymilvus==2.4.9",
  "PyJWT==2.13.0",
]

[project.optional-dependencies]
bge = [
  "sentence-transformers==3.3.1",
]
mcp = [
  "mcp>=1.0",
]

[tool.setuptools.packages.find]
include = ["backend*", "mock_services*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
norecursedirs = [".git", ".pytest_cache", "node_modules", "tmp", "output", "worktrees", "_docx_handoff_qa"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

