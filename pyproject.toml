[project]
name = "enterprise-customer-operations-platform"
version = "0.1.0"
description = "Domain and database foundation for enterprise customer operations platform"
requires-python = "==3.11.15"
dependencies = [
  "SQLAlchemy==2.0.49",
  "asyncpg==0.30.0",
  "pydantic==2.12.5",
  "pytest==8.3.4",
  "pytest-asyncio==0.24.0",
  "alembic==1.18.5",
  "langgraph==1.1.10",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

